# Main NEAT runtime settings.
# We are not using neat-python's classic generation loop directly for gameplay,
# but the library still requires this section to configure population/genome behavior.
[NEAT]
# How neat-python decides the winner if its generation runner is ever used.
fitness_criterion     = max

# High placeholder target. rtNEAT will mostly use continuous relative fitness,
# so this should not drive normal simulation stopping.
fitness_threshold     = 1000.0

# Match the current herbivore population size.
pop_size              = 50

# Do not silently recreate a population if every species dies out.
# In rtNEAT, extinction/replacement should be handled by our realtime manager.
reset_on_extinction   = False

# Keep neat-python's normal fitness-threshold behavior available if its
# classic generation runner is ever used. rtNEAT will not rely on this.
no_fitness_termination = False


# Genome structure and mutation rules for herbivore brains.
[DefaultGenome]
# Forty-three sensor inputs:
# 1. constant
# 2. feeding drive (energy deficit gated by available stomach capacity)
# 3. reproductive readiness
# 4. current energy percent
# 5. current speed
# 6. visible creature count
# 7. visible food count
# 8. clock tik-tok
# 9. clock chronometer
# 10. clock time alive
# 11. food proximity
# 12. food angle
# 13. creature proximity
# 14. creature angle
# 15. wall proximity
# 16. wall angle
# 17. is currently grabbing food
# 18. local expected food density (richness)
# 19. body-frame lateral richness gradient (left minus right)
# 20. body-frame forward richness gradient (ahead minus here)
#
# Proximity inputs use:
# 0.0 = target absent or visible but far
# 1.0 = target visible and close
#
# Angle inputs use:
# -1.0 = right edge of field of view
#  0.0 = centered
#  1.0 = left edge of field of view
#
# 21. own infant proximity
# 22. own infant angle
# 23. compatible social presence
# 24. target-scaled compatible flockmate count
# 25. compatible center, body-frame forward component
# 26. compatible center, body-frame right component
# 27. compatible relative velocity, body-frame forward component
# 28. compatible relative velocity, body-frame right component
# 29. long-range social intensity
# 30. long-range social direction, body-frame forward component
# 31. long-range social direction, body-frame right component
# 32. stomach fullness (satiety)
# 33. acoustic signal strength
# 34. acoustic relative direction sine
# 35. acoustic relative direction cosine
# 36. acoustic tone
# 37. trail pheromone here
# 38. trail pheromone forward-left
# 39. trail pheromone forward-right
# 40. alarm pheromone here
# 41. alarm pheromone forward-left
# 42. alarm pheromone forward-right
# 43. remaining life reserve
#
# Compatibility note: checkpoints created with an older sensing schema keep
# their physical world and biological ages, but start a fresh neural/species
# epoch because several input positions intentionally changed meaning.
num_inputs              = 43

# Fifteen action outputs:
# 1. accelerate
# 2. rotate (-1 right/clockwise, +1 left/counterclockwise)
# 3. want to reproduce
# 4. want to eat
# 5. reset chronometer
# 6. want to grab food
# 7. want to release food
# 8. want to nurse
# 9. flee / panic intensity
# 10. herding drive
# 11. emit acoustic signal
# 12. acoustic tone
# 13. emit trail pheromone
# 14. emit alarm pheromone
# 15. continuous rest intent
#
# Separation, alignment, and cohesion are inherited biological traits rather
# than direct neural actions.
num_outputs             = 15

# Start without hidden nodes so initial brains are simple direct mappings.
num_hidden              = 0

# Start sparsely connected so initial brains remain simple.
# The action layer centers a zero-evidence sigmoid output of 0.5 at 0.0.
#initial_connection       = full_direct
initial_connection      = partial_direct 0.15
#initial_connection      = unconnected
#initial_connection      = fs_neat_nohidden

# Use sigmoid for smoother positive activation from sparse early networks.
activation_default      = sigmoid
activation_mutate_rate  = 0.01
activation_options      = sigmoid tanh clamped relu lelu

aggregation_default     = sum
aggregation_mutate_rate = 0.005
aggregation_options     = sum mean maxabs

# Bias mutation controls. Biases let output nodes shift behavior even
# when sensor values are neutral or zero.
bias_init_mean          = 0.0
bias_init_stdev         = 0.1
bias_max_value          = 5.0
bias_min_value          = -5.0
bias_mutate_power       = 0.2
bias_mutate_rate        = 0.5
bias_replace_rate       = 0.05

# Response scales node activation. Keep it fixed for now to reduce
# the number of things evolution can change early on.
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 5.0
response_min_value      = -5.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

# Species compatibility coefficients. These matter if/when we use
# neat-python species grouping for parent selection.
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

# Structural connection mutation. Empty initial networks need a strong
# chance to discover links early, while deletion stays lower.
conn_add_prob           = 0.4
conn_delete_prob        = 0.01

# Connections start enabled. Mutation can still disable/reenable links.
enabled_default         = True
enabled_mutate_rate     = 0.05

# Keep networks feed-forward for predictable one-frame action decisions.
feed_forward            = True 

# Structural node mutation. Node additions are encouraged after links emerge.
node_add_prob           = 0.05
node_delete_prob        = 0.005

# Connection weight mutation controls.
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 5.0
weight_min_value        = -5.0
weight_mutate_power     = 0.2
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.02


# Species grouping behavior.
# rtNEAT can start simple, but keeping this valid lets us reuse neat-python tools.
[DefaultSpeciesSet]
compatibility_threshold = 3.0


# Stagnation settings used by neat-python's classic reproduction machinery.
# Mostly a compatibility requirement for now.
[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 20
species_elitism      = 1


# Classic reproduction settings.
# We may not call neat-python's normal generation reproduction loop in rtNEAT,
# but the config object requires this section.
[DefaultReproduction]
elitism            = 1
survival_threshold = 0.2
